name: Native CI dependencies
description: Restore the project's FFmpeg build, NeMo-Speech and cached Linux native dependencies.
inputs:
  ffmpeg-key:
    description: >-
      Producer fingerprint of the minimal FFmpeg profiles (ffmpeg.yml). When set, the
      profiles are restored by this key and provisioned with NeMo-Speech. When empty,
      the caller provisions FFmpeg itself (release jobs compile without binary cache).
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/ci-apt
    - name: Verify NeMo SDK cleanup on this runner
      shell: bash
      run: python -I -B scripts/nemo_speech_selftest.py

    - name: Locate shared NeMo cache
      shell: bash
      run: echo "KINEWRIGHT_NEMO_CACHE=$RUNNER_TEMP/nemo-speech" >> "$GITHUB_ENV"
    - name: Read Linux NeMo build key
      if: runner.os == 'Linux'
      id: nemo-linux
      shell: bash
      run: |
        key=$(nice -n 19 python3 -I scripts/nemo_speech.py --print-key)
        echo "key=$key" >> "$GITHUB_OUTPUT"
    - name: Read MSVC NeMo build key
      if: runner.os == 'Windows'
      id: nemo-windows
      shell: pwsh
      run: |
        $key = & .\scripts\setup-ffmpeg.ps1 -NemoCacheKeyOnly
        if ($LASTEXITCODE -ne 0) { throw 'NeMo cache key failed' }
        "key=$key" >> $env:GITHUB_OUTPUT
    - name: Read NeMo runner image identity
      id: nemo-image
      shell: bash
      run: echo "key=$RUNNER_ARCH-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
    - name: Restore built NeMo SDK by pins, patches, compiler and settings
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        key: nemo-${{ runner.os }}-${{ steps.nemo-image.outputs.key }}-${{ steps.nemo-linux.outputs.key || steps.nemo-windows.outputs.key }}
        path: |
          ${{ runner.temp }}/nemo-speech/*/.build-key
          ${{ runner.temp }}/nemo-speech/*/bin
          ${{ runner.temp }}/nemo-speech/*/lib
          ${{ runner.temp }}/nemo-speech/*/include
          ${{ runner.temp }}/nemo-speech/*/share
    - name: Restore and provision the minimal FFmpeg profiles and NeMo-Speech
      if: inputs.ffmpeg-key != ''
      uses: ./.github/actions/ffmpeg
      with:
        cache-key: ${{ inputs.ffmpeg-key }}
