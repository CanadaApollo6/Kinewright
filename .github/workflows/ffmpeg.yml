name: Minimal FFmpeg source builds
on:
  workflow_call:
    outputs:
      linux-key:
        description: Linux toolchain/dependency fingerprint.
        value: ${{ jobs.linux.outputs.key }}
      windows-key:
        description: MSVC toolchain/dependency fingerprint.
        value: ${{ jobs.windows.outputs.key }}
jobs:
  linux:
    name: Minimal FFmpeg (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      key: ${{ steps.profiles.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: Check profile CBS dependencies before compiling
        run: python -B scripts/test_ffmpeg_build.py SourceAdmission.test_profiles_supply_a_type_for_libavformat_cbs SourceAdmission.test_cbs_check_catches_missing_av1_even_with_vp9_enabled
      - uses: ./.github/actions/ffmpeg
        id: profiles
        with:
          producer: 'true'
      - name: Source admission witnesses
        run: python -B scripts/test_ffmpeg_build.py
  windows:
    name: Minimal FFmpeg (windows-2022)
    # windows-2022 keeps Visual Studio 2022 (MSVC 14.44). The Windows Server
    # 2025 images moved to Visual Studio 2026, whose compiler rejects the
    # pinned dav1d 1.5.4 (C7780 in compat/msvc/stdatomic.h). ci.yml and
    # release.yml use the same image so every Windows binary shares one toolset.
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      key: ${{ steps.profiles.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: Check profile CBS dependencies before compiling
        run: python -B scripts/test_ffmpeg_build.py SourceAdmission.test_profiles_supply_a_type_for_libavformat_cbs SourceAdmission.test_cbs_check_catches_missing_av1_even_with_vp9_enabled
      - uses: ./.github/actions/ffmpeg
        id: profiles
        with:
          producer: 'true'
      - name: Source admission witnesses
        run: python -B scripts/test_ffmpeg_build.py
