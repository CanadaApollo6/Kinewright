name: Windows LPAC spike

on:
  push:
    branches: [ms2-1b]

permissions:
  contents: read

jobs:
  lpac-native:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Run LPAC native witnesses
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: |
          $env:KINEWRIGHT_LPAC_SELECTION_FILE = Join-Path $PWD 'target/lpac-spike-selection.txt'
          cargo test -p kinewright-job-sys --features lpac-diagnostics --test lpac_native -- diagnose_lpac_creation_variants --ignored --exact --nocapture --test-threads=1
          $diagnosticExit = $LASTEXITCODE
          if (Test-Path -LiteralPath $env:KINEWRIGHT_LPAC_SELECTION_FILE) {
            $env:KINEWRIGHT_LPAC_TEST_VARIANT = (Get-Content -LiteralPath $env:KINEWRIGHT_LPAC_SELECTION_FILE -Raw).Trim()
            Remove-Item -LiteralPath $env:KINEWRIGHT_LPAC_SELECTION_FILE
          } else {
            $env:KINEWRIGHT_LPAC_TEST_VARIANT = 'none'
          }
          if ($diagnosticExit -ne 0) { exit $diagnosticExit }
          Write-Host "Full witness variant: $env:KINEWRIGHT_LPAC_TEST_VARIANT"
          cargo test -p kinewright-job-sys --features lpac-diagnostics --test lpac_native -- --nocapture --test-threads=1
          exit $LASTEXITCODE
