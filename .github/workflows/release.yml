name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-2025
    timeout-minutes: 150

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate release tag
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $app = $metadata.packages | Where-Object name -eq 'kinewright-app'
          if (-not $app) {
            throw 'cargo metadata did not contain kinewright-app.'
          }
          $expectedTag = "v$($app.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match workspace version '$($app.version)'. Expected '$expectedTag'."
          }
          "KINEWRIGHT_VERSION=$($app.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify preinstalled installer toolchains
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = @(
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7\ISCC.exe')
            ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw 'The windows-2025 image does not contain ISCC.exe.'
          }
          $innoVersion = (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion
          Write-Host "Selected toolchain: Inno Setup $innoVersion at $iscc"
          "KINEWRIGHT_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $candle = (Get-Command candle.exe -ErrorAction SilentlyContinue).Source
          if (-not $candle) {
            $wixRoots = @(Get-ChildItem -LiteralPath ${env:ProgramFiles(x86)} -Directory -Filter 'WiX Toolset*' -ErrorAction SilentlyContinue)
            if ($wixRoots.Count -gt 0) {
              $candle = Get-ChildItem -Path $wixRoots.FullName -Recurse -File -Filter 'candle.exe' -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
            }
          }
          if ($candle) {
            $wixVersion = (Get-Item -LiteralPath $candle).VersionInfo.ProductVersion
            Write-Host "Available alternative: WiX $wixVersion at $candle"
          } else {
            Write-Warning 'WiX was not detected, but it is not used by this release job.'
          }

      - name: Compile verified FFmpeg source without binary cache
        uses: ./.github/actions/ffmpeg
        with:
          no-binary-cache: 'true'

      - name: Provision FFmpeg, test, build, and package
        run: |
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw "Workspace tests failed with exit code $LASTEXITCODE." }

          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --package kinewright-app --release --locked
          if ($LASTEXITCODE -ne 0) { throw "Release build failed with exit code $LASTEXITCODE." }

          Write-Host 'Kinewright.exe runtime dependencies:'
          dumpbin /dependents .\target\release\kinewright-app.exe

          & .\scripts\package-windows.ps1 -Version $env:KINEWRIGHT_VERSION -IsccPath $env:KINEWRIGHT_ISCC -NoBinaryCache
          & .\scripts\test-windows-bundle.ps1 -BundleDir .\dist\windows-x64

          $installers = @(Get-ChildItem -LiteralPath .\dist\installer -File -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
          Write-Host "Installer SHA-256: $hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinewright-${{ env.KINEWRIGHT_VERSION }}-windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          if-no-files-found: error
          retention-days: 30

  linux-tarball:
    name: Linux tarball
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        uses: ./.github/actions/ci-native
        timeout-minutes: 8

      - name: Validate release tag
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; packages=json.load(sys.stdin)["packages"]; app=next(p for p in packages if p["name"]=="kinewright-app"); print(app["version"])')"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match workspace version '${version}'. Expected '${expected}'." >&2
            exit 1
          fi
          echo "KINEWRIGHT_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Compile verified FFmpeg source without binary cache
        uses: ./.github/actions/ffmpeg
        with:
          no-binary-cache: 'true'

      - uses: ./.github/actions/ci-user-session

      - name: Test workspace with the Linux media sandbox
        run: |
          cargo build --locked -p kinewright-media-helper -p kinewright-media-supervisor --bins
          if [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" == 1 ]]; then
            trap 'sudo ./scripts/install-apparmor-profile.sh remove' EXIT
            sudo ./scripts/install-apparmor-profile.sh install "$PWD/target/debug/kinewright-media-helper"
          fi
          systemd-run --user --scope --quiet --collect -- cargo test --workspace --locked

      - name: Build and package Kinewright for Linux
        run: |
          cargo build --release --locked -p kinewright-app -p kinewright-media-helper -p kinewright-media-supervisor
          ./scripts/package-linux.sh --version "${KINEWRIGHT_VERSION}" --no-binary-cache

      - name: Test the unpacked Linux tarball
        run: |
          shopt -s nullglob
          tarballs=(dist/tarball/*.tar.gz)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected one Linux tarball, found ${#tarballs[@]}." >&2
            exit 1
          fi
          tarball="${tarballs[0]}"
          unpack_dir="$(mktemp -d "$RUNNER_TEMP/Kinewright bundle.XXXXXX")"
          bundle="$unpack_dir/linux-x64"
          tar -xzf "$tarball" -C "$unpack_dir"
          if [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" == 1 ]]; then
            trap 'sudo "$bundle/scripts/install-apparmor-profile.sh" remove' EXIT
            sudo "$bundle/scripts/install-apparmor-profile.sh" install "$bundle/kinewright-media-helper"
          fi
          systemd-run --user --scope --quiet --collect -- ./scripts/test-linux-bundle.sh --bundle-dir "$bundle"
          hash="$(sha256sum "${tarball}" | awk '{print $1}')"
          echo "${hash}  $(basename "${tarball}")" > "${tarball}.sha256"
          echo "Tarball SHA-256: ${hash}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinewright-${{ env.KINEWRIGHT_VERSION }}-linux-x64
          path: |
            dist/tarball/*.tar.gz
            dist/tarball/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [windows-installer, linux-tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Kinewright-*-*-x64
          path: release-artifacts

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          installers=(release-artifacts/Kinewright-"${version}"-windows-x64/*.exe)
          tarballs=(release-artifacts/Kinewright-"${version}"-linux-x64/*.tar.gz)
          if [[ "${#installers[@]}" -ne 1 || "${#tarballs[@]}" -ne 1 ]]; then
            echo 'Expected one Windows installer and one Linux tarball.' >&2
            exit 1
          fi
          assets=("${installers[0]}" "${installers[0]}.sha256" "${tarballs[0]}" "${tarballs[0]}.sha256")
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done
          # A release becomes public only after all four files are attached
          # and checked. A published release is never modified by a rerun.
          expected="$(for asset in "${assets[@]}"; do
            printf '%s %s\n' "$(basename "$asset")" "$(stat -c %s "$asset")"
          done | sort)"
          expected_names="$(cut -d' ' -f1 <<<"$expected")"
          tag="${GITHUB_REF_NAME}"

          if state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>view-error.txt)"; then
            :
          elif grep -qi 'release not found' view-error.txt; then
            state=absent
          else
            cat view-error.txt >&2
            exit 1
          fi

          if [[ "$state" == false ]]; then
            published_names="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
            if [[ "$published_names" == "$expected_names" ]]; then
              echo "Release $tag is already published with all four files. Nothing to do."
              exit 0
            fi
            echo "Release $tag is already published but its files differ from the expected four." >&2
            echo "It was left unchanged. Repair or delete it by hand, then rerun." >&2
            exit 1
          fi

          if [[ "$state" == absent ]]; then
            gh release create "$tag" --draft --verify-tag --generate-notes --title "Kinewright $tag"
          elif [[ "$state" != true ]]; then
            echo "Unexpected release state: $state" >&2
            exit 1
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
          attached="$(gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort)"
          if [[ "$attached" != "$expected" ]]; then
            echo 'The draft release does not hold exactly the four expected files. It stays a draft.' >&2
            printf 'expected:\n%s\nattached:\n%s\n' "$expected" "$attached" >&2
            exit 1
          fi
          gh release edit "$tag" --draft=false
