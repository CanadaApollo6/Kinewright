name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate release tag
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $app = $metadata.packages | Where-Object name -eq 'openreel-app'
          if (-not $app) {
            throw 'cargo metadata did not contain openreel-app.'
          }
          $expectedTag = "v$($app.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match workspace version '$($app.version)'. Expected '$expectedTag'."
          }
          "OPENREEL_VERSION=$($app.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify preinstalled installer toolchains
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = @(
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7\ISCC.exe')
            ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw 'The windows-latest image does not contain ISCC.exe.'
          }
          $innoVersion = (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion
          Write-Host "Selected toolchain: Inno Setup $innoVersion at $iscc"
          "OPENREEL_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $candle = (Get-Command candle.exe -ErrorAction SilentlyContinue).Source
          if (-not $candle) {
            $wixRoots = @(Get-ChildItem -LiteralPath ${env:ProgramFiles(x86)} -Directory -Filter 'WiX Toolset*' -ErrorAction SilentlyContinue)
            if ($wixRoots.Count -gt 0) {
              $candle = Get-ChildItem -Path $wixRoots.FullName -Recurse -File -Filter 'candle.exe' -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
            }
          }
          if ($candle) {
            $wixVersion = (Get-Item -LiteralPath $candle).VersionInfo.ProductVersion
            Write-Host "Available alternative: WiX $wixVersion at $candle"
          } else {
            Write-Warning 'WiX was not detected, but it is not used by this release job.'
          }

      - name: Provision FFmpeg, test, build, and package
        run: |
          & .\scripts\setup-ffmpeg.ps1
          cargo test --workspace --locked

          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --package openreel-app --release --locked

          Write-Host 'OpenReel.exe runtime dependencies:'
          dumpbin /dependents .\target\release\openreel-app.exe

          & .\scripts\package-windows.ps1 -Version $env:OPENREEL_VERSION -IsccPath $env:OPENREEL_ISCC
          & .\scripts\test-windows-bundle.ps1 -BundleDir .\dist\windows-x64

          $installers = @(Get-ChildItem -LiteralPath .\dist\installer -File -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
          Write-Host "Installer SHA-256: $hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenReel-${{ env.OPENREEL_VERSION }}-windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath .\dist\installer -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -ne 2) {
            throw "Expected installer and checksum assets, found $($assets.Count)."
          }

          & gh release view $env:GITHUB_REF_NAME *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            & gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            & gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "OpenReel $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed with exit code $LASTEXITCODE."
          }

  linux-tarball:
    name: Linux tarball
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: ./scripts/install-linux-deps.sh

      - name: Validate release tag
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; packages=json.load(sys.stdin)["packages"]; app=next(p for p in packages if p["name"]=="openreel-app"); print(app["version"])')"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match workspace version '${version}'. Expected '${expected}'." >&2
            exit 1
          fi
          echo "OPENREEL_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Provision FFmpeg, test, build, and package
        run: |
          source ./scripts/setup-ffmpeg.sh
          cargo test --workspace --locked
          cargo build --package openreel-app --release --locked
          ./scripts/package-linux.sh --version "${OPENREEL_VERSION}"
          ./scripts/test-linux-bundle.sh --bundle-dir ./dist/linux-x64
          tarball="$(find ./dist/tarball -maxdepth 1 -type f -name '*.tar.gz')"
          if [[ -z "${tarball}" || "$(echo "${tarball}" | wc -l)" -ne 1 ]]; then
            echo "Expected one Linux tarball, found: ${tarball}" >&2
            exit 1
          fi
          hash="$(sha256sum "${tarball}" | awk '{print $1}')"
          echo "${hash}  $(basename "${tarball}")" > "${tarball}.sha256"
          echo "Tarball SHA-256: ${hash}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenReel-${{ env.OPENREEL_VERSION }}-linux-x64
          path: |
            dist/tarball/*.tar.gz
            dist/tarball/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find ./dist/tarball -maxdepth 1 -type f | sort)
          if [[ "${#assets[@]}" -ne 2 ]]; then
            echo "Expected tarball and checksum assets, found ${#assets[@]}." >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --verify-tag --generate-notes --title "OpenReel ${GITHUB_REF_NAME}"
          fi
