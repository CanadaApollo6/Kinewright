name: CI

# Two test tiers, both on Linux and Windows (ci/slow-tests.txt lists the slow tier):
#   fast  every push and pull request that changes more than documentation:
#         cargo test --workspace with the slow tests skipped, clippy and fmt.
#   slow  the tests that each take a minute or more (end-to-end scenarios, loudness
#         measurement, wire-limit probes): a push to main, a manual run, or a push
#         whose head commit message contains `[slow-tier]`.
# A push that changes only documentation runs nothing. release.yml is not
# affected: it triggers on `v*` tags only, which paths-ignore does not filter.
# Kani proofs moved to kani.yml.
on:
  push:
    paths-ignore:
      - 'docs/**/*.md'
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**/*.md'
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

jobs:
  pf1-wrapper:
    name: Linux PF1 wrapper witnesses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # The runner context is unavailable in job-level env, so derive the path in a step.
      - name: Set PF1 runner path
        run: echo "PF1_RUNNERS=$RUNNER_TEMP/pf1-runners" >> "$GITHUB_ENV"
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore hash-verified PF1 runners
        run: python3 ci/pf1/restore.py "$PF1_RUNNERS"
      - name: PF1 wrapper witnesses (synthetic child, no GPU or FFmpeg)
        run: python3 scripts/pf1/test_lane.py

  windows:
    name: Windows workspace
    timeout-minutes: 60
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # Default key includes rustc (host/release/hash) and a hash of every
      # Cargo.lock / Cargo.toml, so a lockfile or toolchain bump misses.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: PF1 portable pins witnesses
        run: python scripts/pf1/test_validate.py

      - name: Check formatting
        run: cargo fmt --check

      - name: Prepare sealed JA S1 predecessor controls
        shell: bash
        run: bash scripts/ja-s1-predecessor-controls.sh

      - name: Provision FFmpeg, test (fast tier), and lint
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          # pwsh does not stop on a native command's non-zero exit, so without
          # these checks the step's status is the last command's and a failing
          # `cargo test` is reported as success.
          $ErrorActionPreference = 'Stop'
          & .\scripts\setup-ffmpeg.ps1
          if ($LASTEXITCODE -ne 0) { throw "setup-ffmpeg.ps1 exited $LASTEXITCODE" }
          $buildTimes = @()
          $clock = [System.Diagnostics.Stopwatch]::StartNew()
          cargo build --workspace
          if ($LASTEXITCODE -ne 0) { throw "cargo build --workspace exited $LASTEXITCODE" }
          $clock.Stop()
          $buildTimes += @{ command = 'cargo build --workspace'; seconds = $clock.Elapsed.TotalSeconds }
          $clock.Restart()
          cargo build -p kinewright-agent --no-default-features --lib
          if ($LASTEXITCODE -ne 0) { throw "cargo build agent shipping library exited $LASTEXITCODE" }
          $clock.Stop()
          $buildTimes += @{ command = 'cargo build -p kinewright-agent --no-default-features --lib'; seconds = $clock.Elapsed.TotalSeconds }
          $clock.Restart()
          cargo build -p kinewright-app --no-default-features --bin kinewright-app
          if ($LASTEXITCODE -ne 0) { throw "cargo build app shipping binary exited $LASTEXITCODE" }
          $clock.Stop()
          $buildTimes += @{ command = 'cargo build -p kinewright-app --no-default-features --bin kinewright-app'; seconds = $clock.Elapsed.TotalSeconds }
          $clock.Restart()
          cargo build -p kinewright-agent --no-default-features --bin kinewright
          if ($LASTEXITCODE -ne 0) { throw "cargo build shipping writer host exited $LASTEXITCODE" }
          $clock.Stop()
          $buildTimes += @{ command = 'cargo build -p kinewright-agent --no-default-features --bin kinewright'; seconds = $clock.Elapsed.TotalSeconds }
          $rustVersion = rustc -Vv
          if ($LASTEXITCODE -ne 0) { throw "rustc -Vv exited $LASTEXITCODE" }
          $totalSeconds = ($buildTimes | Measure-Object -Property seconds -Sum).Sum
          @{
            head_sha = '${{ github.sha }}'
            ci_url = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            runner_os = $env:RUNNER_OS
            runner_image = $env:ImageOS
            runner_image_version = $env:ImageVersion
            toolchain = ($rustVersion -join "`n")
            cache_state = 'Swatinem/rust-cache@v2; see Cache Rust step for restore hit/miss'
            commands = $buildTimes
            extra_build_minutes = $totalSeconds / 60
            c8_host_build_minutes = $buildTimes[-1].seconds / 60
            timeout_minutes = 60
          } | ConvertTo-Json -Depth 4 | Tee-Object -FilePath "$env:RUNNER_TEMP/ja1-c1-windows-build-times.json"
          "JA-1 C1/C8 added builds: $($totalSeconds / 60) minutes; C8 host link: $($buildTimes[-1].seconds / 60) minutes" >> $env:GITHUB_STEP_SUMMARY
          # slow_tests.py runs `cargo test --workspace` (the slow tests are
          # ignored without their feature) and fails unless the tests it
          # skipped are exactly ci/slow-tests.txt plus the ignores that
          # ci/ignored-tests.txt lists for this OS, each observed as ignored.
          python scripts/slow_tests.py fast
          if ($LASTEXITCODE -ne 0) { throw "slow_tests.py fast (cargo test --workspace) exited $LASTEXITCODE" }
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy --workspace --all-targets exited $LASTEXITCODE" }

      - name: Retain JA-1 Windows build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ja1-c1-windows-build-times-${{ github.sha }}
          path: ${{ runner.temp }}/ja1-c1-windows-build-times.json
          if-no-files-found: warn

  windows-slow:
    name: Windows slow tier
    runs-on: windows-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' ||
        contains(github.event.head_commit.message, '[slow-tier]')))

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Provision FFmpeg and run the slow tier
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\setup-ffmpeg.ps1
          # Runs exactly the tests in ci/slow-tests.txt with every crate's
          # `slow-tests` feature on, and fails unless all of them ran and passed.
          python scripts/slow_tests.py slow
          if ($LASTEXITCODE -ne 0) { throw "slow_tests.py slow exited $LASTEXITCODE" }

  linux:
    name: Linux workspace
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Default key includes rustc (host/release/hash) and a hash of every
      # Cargo.lock / Cargo.toml, so a lockfile or toolchain bump misses.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # The Azure Ubuntu mirror has stalled for 30+ minutes on the large debs
      # (cmake, libclang, mesa), twice on 2026-10-22, which ran the job into
      # its timeout. Keep the downloaded archives between runs so a warm run
      # fetches only the package indexes. The key carries the runner image
      # version (a runner environment variable, which the `env` expression
      # context does not see), so the cache follows the image's packages.
      - name: Read the runner image version
        id: image
        run: echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore apt archives
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-${{ steps.image.outputs.key }}-${{ hashFiles('scripts/install-linux-deps.sh') }}
          restore-keys: apt-

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' |
            sudo tee /etc/apt/apt.conf.d/99kinewright-keep-debs >/dev/null
          mkdir -p ~/apt-archives
          if compgen -G ~/apt-archives/'*.deb' >/dev/null; then
            sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/
          fi
          ./scripts/install-linux-deps.sh
          # Drop archives the mirror no longer serves, so a cache restored
          # from an older image does not grow without bound. A caching miss
          # must not fail the job.
          sudo apt-get autoclean -qq
          if compgen -G /var/cache/apt/archives/'*.deb' >/dev/null; then
            cp /var/cache/apt/archives/*.deb ~/apt-archives/
          fi
          echo "apt archives cached: $(find ~/apt-archives -name "*.deb" | wc -l) debs, $(du -sh ~/apt-archives | cut -f1)"

      # Saved here rather than in a post step: a slow download is exactly the
      # run most likely to time out later, and a post step saves only when
      # the whole job succeeds.
      - name: Save apt archives
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: PF1 portable pins witnesses
        run: python scripts/pf1/test_validate.py

      - name: Check formatting
        run: cargo fmt --check

      - name: Check the slow-test manifest and ignored-test allowlist format against the source, and the parser
        run: |
          python3 scripts/slow_tests.py lint
          python3 scripts/slow_tests_selftest.py

      - name: Prepare sealed JA S1 predecessor controls
        shell: bash
        run: bash scripts/ja-s1-predecessor-controls.sh

      - name: Provision FFmpeg, build, test (fast tier), and lint
        run: |
          # `set -e` alone is not enough: sourcing a script that manipulates
          # shell options can switch it back off, which is how a failing
          # `cargo test --workspace` reported success here for months. Each
          # command carries its own check, so the step's status cannot become
          # the last command's.
          set -euo pipefail
          source ./scripts/setup-ffmpeg.sh
          set -euo pipefail
          cargo build --workspace || exit 1
          readelf -d target/debug/kinewright-eval | grep -F '[libavcodec.so.62]' || exit 1
          # slow_tests.py runs `cargo test --workspace` (the slow tests are
          # ignored without their feature) and fails unless the tests it
          # skipped are exactly ci/slow-tests.txt plus the ignores that
          # ci/ignored-tests.txt lists for this OS, each observed as ignored.
          python3 scripts/slow_tests.py fast || exit 1
          cargo clippy --workspace --all-targets -- -D warnings || exit 1

  linux-slow:
    name: Linux slow tier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' ||
        contains(github.event.head_commit.message, '[slow-tier]')))

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Equip guardian user session
        run: |
          sudo loginctl enable-linger "$(id -un)" || true
          sudo systemctl start "user@$(id -u).service" || true
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # The Azure Ubuntu mirror has stalled for 30+ minutes on the large debs
      # (cmake, libclang, mesa), twice on 2026-10-22, which ran the job into
      # its timeout. Keep the downloaded archives between runs so a warm run
      # fetches only the package indexes. The key carries the runner image
      # version (a runner environment variable, which the `env` expression
      # context does not see), so the cache follows the image's packages.
      - name: Read the runner image version
        id: image
        run: echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore apt archives
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-${{ steps.image.outputs.key }}-${{ hashFiles('scripts/install-linux-deps.sh') }}
          restore-keys: apt-

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' |
            sudo tee /etc/apt/apt.conf.d/99kinewright-keep-debs >/dev/null
          mkdir -p ~/apt-archives
          if compgen -G ~/apt-archives/'*.deb' >/dev/null; then
            sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/
          fi
          ./scripts/install-linux-deps.sh
          # Drop archives the mirror no longer serves, so a cache restored
          # from an older image does not grow without bound. A caching miss
          # must not fail the job.
          sudo apt-get autoclean -qq
          if compgen -G /var/cache/apt/archives/'*.deb' >/dev/null; then
            cp /var/cache/apt/archives/*.deb ~/apt-archives/
          fi
          echo "apt archives cached: $(find ~/apt-archives -name "*.deb" | wc -l) debs, $(du -sh ~/apt-archives | cut -f1)"

      # Saved here rather than in a post step: a slow download is exactly the
      # run most likely to time out later, and a post step saves only when
      # the whole job succeeds.
      - name: Save apt archives
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Provision FFmpeg and run the slow tier
        run: |
          set -euo pipefail
          source ./scripts/setup-ffmpeg.sh
          set -euo pipefail
          # Runs exactly the tests in ci/slow-tests.txt with every crate's
          # `slow-tests` feature on, and fails unless all of them ran and passed.
          python3 scripts/slow_tests.py slow || exit 1
