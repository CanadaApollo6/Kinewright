name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows workspace
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # Default key includes rustc (host/release/hash) and a hash of every
      # Cargo.lock / Cargo.toml, so a lockfile or toolchain bump misses.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check formatting
        run: cargo fmt --check

      - name: Provision FFmpeg, build, test, and lint
        shell: pwsh
        run: |
          # pwsh does not stop on a native command's non-zero exit, so without
          # these checks the step's status is the last command's and a failing
          # `cargo test` is reported as success.
          $ErrorActionPreference = 'Stop'
          & .\scripts\setup-ffmpeg.ps1
          # `cargo test` compiles the workspace with cfg(test). A separate
          # `cargo build --workspace` on windows-latest is several minutes of
          # MSVC work the test step then repeats. Linux keeps the extra build
          # for the readelf soname gate on the non-test binary.
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { throw "cargo test --workspace exited $LASTEXITCODE" }
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy --workspace --all-targets exited $LASTEXITCODE" }

  linux:
    name: Linux workspace
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Default key includes rustc (host/release/hash) and a hash of every
      # Cargo.lock / Cargo.toml, so a lockfile or toolchain bump misses.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: ./scripts/install-linux-deps.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Provision FFmpeg, build, test, and lint
        run: |
          # `set -e` alone is not enough: sourcing a script that manipulates
          # shell options can switch it back off, which is how a failing
          # `cargo test --workspace` reported success here for months. Each
          # command carries its own check, so the step's status cannot become
          # the last command's.
          set -euo pipefail
          source ./scripts/setup-ffmpeg.sh
          set -euo pipefail
          cargo build --workspace || exit 1
          readelf -d target/debug/kinewright-eval | grep -F '[libavcodec.so.62]' || exit 1
          cargo test --workspace || exit 1
          cargo clippy --workspace --all-targets -- -D warnings || exit 1

  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Default key includes rustc (host/release/hash) and a hash of every
      # Cargo.lock / Cargo.toml, so a lockfile or toolchain bump misses.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # `cargo kani setup` downloads the pinned toolchain + CBMC bundle and
      # no-ops when it is already present, so this cache skips the big
      # download on warm runners. Both paths: `~/.kani/kani-<version>/
      # toolchain` is a symlink into the rustup toolchain dir, so caching
      # only `~/.kani` would restore a dangling link. The toolchain dir
      # name comes with the Kani version — bump both together.
      - name: Cache Kani
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.rustup/toolchains/nightly-2026-08-21-x86_64-unknown-linux-gnu
          key: kani-0.68.0

      # No native-deps step: kinewright-core is pure Rust (ab_glyph,
      # crossbeam-channel, schemars, serde, thiserror), and the Kani bundle
      # ships prebuilt binaries (compiler, CBMC, solvers).
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup

      # Only the named, admitted harnesses (each < 5 min / < 6 GB per the
      # admission rule in incident.rs): never bare `cargo kani`, which would
      # also pick up future proofs that do not meet the rule.
      - name: Verify admitted proofs
        run: |
          set -euo pipefail
          cargo kani -p kinewright-core --harness kani_restore_id_resume || exit 1
          cargo kani -p kinewright-core --harness kani_compact_json_len_anchor || exit 1
          cargo kani -p kinewright-core --harness kani_compact_json_len_symbolic || exit 1
