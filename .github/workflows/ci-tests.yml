name: Archived test tier
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      tier:
        type: string
        required: true
      shards:
        type: string
        required: true
      ffmpeg-key:
        description: Fingerprint of the minimal FFmpeg profiles built by ffmpeg.yml for this OS.
        type: string
        required: true

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TERM_COLOR: never
  RUST_TEST_THREADS: '4'

jobs:
  build:
    name: Build test archive
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os == 'Linux' && 'linux' || 'windows' }}${{ inputs.tier == 'slow' && '-slow' || '' }}
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ./.github/actions/ci-native
        timeout-minutes: 8
        with:
          ffmpeg-key: ${{ inputs.ffmpeg-key }}
      - uses: ./.github/actions/ci-nextest
      - uses: ./.github/actions/ci-user-session
        if: runner.os == 'Linux'
      - name: Count shards
        shell: bash
        env:
          SHARDS: ${{ inputs.shards }}
        run: echo "SHARD_COUNT=$(python -c 'import json,os; print(len(json.loads(os.environ["SHARDS"])))')" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        shell: bash
        env:
          TIER: ${{ inputs.tier }}
        run: |
          source scripts/setup-ffmpeg.sh || exit 1
          set -euo pipefail
          session() { systemd-run --user --scope --quiet --collect -- "$@"; }
          session cat /proc/self/cgroup | sed 's/^/test cgroup: /'
          session python scripts/ci_archive.py build --tier "$TIER" --count "$SHARD_COUNT"
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          TIER: ${{ inputs.tier }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\setup-ffmpeg.ps1 -SkipBuildCachePrune
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg setup failed' }
          python scripts/ci_archive.py build --tier $env:TIER --count $env:SHARD_COUNT
          if ($LASTEXITCODE -ne 0) { throw 'archive or doctests failed' }
      - name: Describe test matrix and deadlines
        id: matrix
        shell: bash
        run: python scripts/ci_shards.py matrix --plan ci-artifacts/ci-plan.json >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Linux' && inputs.tier == 'fast'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiler-inputs-${{ inputs.os }}
          path: ci-artifacts/compiler-inputs.*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-${{ inputs.os }}-${{ inputs.tier }}
          path: |
            ci-artifacts/tests.tar.zst
            ci-artifacts/tests.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metadata-${{ inputs.os }}-${{ inputs.tier }}
          path: |
            ci-artifacts/*.json
            ci-artifacts/*.log
            ci-artifacts/*.html
          if-no-files-found: error
          retention-days: 7

  test:
    needs: [build]
    if: >-
      !cancelled() && needs.build.result == 'success'
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ./.github/actions/ci-native
        timeout-minutes: 8
        with:
          ffmpeg-key: ${{ inputs.ffmpeg-key }}
      - uses: ./.github/actions/ci-nextest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: download-tests
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: tests-${{ inputs.os }}-${{ inputs.tier }}
          path: ci-artifacts
      - if: ${{ !cancelled() && steps.download-tests.outcome == 'failure' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 3
        with:
          name: tests-${{ inputs.os }}-${{ inputs.tier }}
          path: ci-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: download-metadata
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: metadata-${{ inputs.os }}-${{ inputs.tier }}
          path: ci-artifacts
      - if: ${{ !cancelled() && steps.download-metadata.outcome == 'failure' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 3
        with:
          name: metadata-${{ inputs.os }}-${{ inputs.tier }}
          path: ci-artifacts
      - name: Read shard prerequisites
        id: requirements
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: python scripts/ci_shards.py requirements --plan ci-artifacts/ci-plan.json --index "$SHARD" >> "$GITHUB_OUTPUT"
      - name: Restore canonical display input
        id: display-cache
        if: steps.requirements.outputs.display_workload != ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ci-fixtures
          key: display-v1-${{ runner.os }}-${{ steps.requirements.outputs.display_cache_id }}-${{ hashFiles('.cargo/ci-test.toml', 'Cargo.toml', 'Cargo.lock', 'crates/kinewright-media/**', 'crates/kinewright-core/**', 'crates/kinewright-hash/**', 'scripts/setup-ffmpeg.*', 'scripts/build-ffmpeg.py', 'scripts/ffmpeg-profile.json', 'scripts/ci_display_inputs.py') }}-${{ steps.requirements.outputs.display_workload }}
      - if: steps.requirements.outputs.compiler_inputs == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: download-compiler
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: compiler-inputs-${{ inputs.os }}
          path: ci-artifacts
      - if: ${{ !cancelled() && steps.download-compiler.outcome == 'failure' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 3
        with:
          name: compiler-inputs-${{ inputs.os }}
          path: ci-artifacts
      - uses: ./.github/actions/ci-user-session
        if: runner.os == 'Linux'
        with:
          unrestrict-userns: ${{ inputs.tier == 'slow' }}
      - name: Extract the Linux test shard
        id: linux-extract
        if: runner.os == 'Linux'
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          TIER: ${{ inputs.tier }}
        run: |
          source scripts/setup-ffmpeg.sh || exit 1
          set -euo pipefail
          session() { systemd-run --user --scope --quiet --collect -- "$@"; }
          session cat /proc/self/cgroup | sed 's/^/test cgroup: /'
          session python scripts/ci_archive.py extract --index "$SHARD" --defer-inputs
          test -x target/debug/kinewright-media-helper
          test -x target/debug/kinewright-media-supervisor
          if [[ "$TIER" == slow ]]; then
            test -x target/debug/kinewright-media-helper-witness
          fi
      - name: Check media admission before installing the AppArmor profile
        if: runner.os == 'Linux' && steps.requirements.outputs.ms2_apparmor_binary != ''
        shell: bash
        env:
          MS2_APPARMOR_BINARY: ${{ steps.requirements.outputs.ms2_apparmor_binary }}
          KINEWRIGHT_MS2_CI_DIAG: '1'
          KINEWRIGHT_MS2_USERNS_EXPECT: refused
        run: |
          source scripts/setup-ffmpeg.sh || exit 1
          set -euo pipefail
          session() { systemd-run --user --scope --quiet --collect -- "$@"; }
          session cat /proc/self/cgroup | sed 's/^/test cgroup: /'
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          session "$MS2_APPARMOR_BINARY" \
            --exact ms2_apparmor_userns_gate_refuses_without_the_profile_and_admits_with_it --nocapture
      - name: Install the media helper AppArmor profile and prepare shard inputs
        id: linux-prepare
        if: ${{ !cancelled() && steps.linux-extract.outcome == 'success' }}
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          sudo ./scripts/install-apparmor-profile.sh install "$PWD/target/debug/kinewright-media-helper"
          source scripts/setup-ffmpeg.sh || exit 1
          set -euo pipefail
          session() { systemd-run --user --scope --quiet --collect -- "$@"; }
          session cat /proc/self/cgroup | sed 's/^/test cgroup: /'
          mkdir -p target/ms2-s1a
          session python scripts/ci_archive.py prepare --index "$SHARD"
      - name: Run the Linux test shard
        if: ${{ !cancelled() && steps.linux-prepare.outcome == 'success' && steps.requirements.outputs.ms2_client_slow != 'true' }}
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          KINEWRIGHT_MS2_USERNS_EXPECT: admitted
          KINEWRIGHT_MS2_CI_DIAG: '1'
        run: |
          source scripts/setup-ffmpeg.sh || exit 1
          set -euo pipefail
          session() { systemd-run --user --scope --quiet --collect -- "$@"; }
          session cat /proc/self/cgroup | sed 's/^/test cgroup: /'
          session python scripts/ci_shards.py run --plan ci-artifacts/ci-plan.json --index "$SHARD"
      - name: MS2 media-client native tests (slow tier)
        if: steps.linux-prepare.outcome == 'success' && steps.requirements.outputs.ms2_client_slow == 'true'
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          KINEWRIGHT_MS2_CI_DIAG: '1'
        run: |
          source scripts/setup-ffmpeg.sh || exit 1
          set -euo pipefail
          session() { systemd-run --user --scope --quiet --collect -- "$@"; }
          session cat /proc/self/cgroup | sed 's/^/test cgroup: /'
          session python scripts/ci_shards.py run --plan ci-artifacts/ci-plan.json --index "$SHARD"
      - name: MS2 kernel diagnostics on failure
        if: runner.os == 'Linux' && (failure() || cancelled())
        timeout-minutes: 2
        shell: bash
        run: |
          sudo journalctl -k --no-pager -o short-monotonic 2>/dev/null |
            grep -iE 'apparmor|audit|seccomp|kinewright' | tail -n 100 || true
          sudo dmesg 2>/dev/null | grep -iE 'apparmor|audit|seccomp|kinewright' | tail -n 100 || true
          sudo aa-status 2>/dev/null | grep -iE 'kinewright|profiles are|processes' || true
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
          journalctl --user --no-pager -o short-monotonic -n 60 -u 'kinewright-media-*' 2>/dev/null || true
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\setup-ffmpeg.ps1
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg setup failed' }
          python scripts/ci_archive.py extract --index $env:SHARD
          if ($LASTEXITCODE -ne 0) { throw 'archive extraction failed' }
          python scripts/ci_shards.py run --plan ci-artifacts/ci-plan.json --index $env:SHARD
          if ($LASTEXITCODE -ne 0) { throw 'test shard failed' }
      - name: Check that tests left the runner recovery folder empty
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from itertools import islice
          from pathlib import Path

          for variable, suffix in (
              ("LOCALAPPDATA", "Kinewright/recovery"),
              ("XDG_STATE_HOME", "kinewright/recovery"),
              ("HOME", ".local/state/kinewright/recovery"),
          ):
              base = Path(os.environ.get(variable, ""))
              if base.is_absolute():
                  directory = base / suffix
                  break
          else:
              raise SystemExit("Could not locate the runner's recovery folder")

          try:
              names = [entry.name for entry in islice(directory.iterdir(), 5)]
          except FileNotFoundError:
              names = []
          if names:
              raise SystemExit(f"Tests wrote to {directory}: {', '.join(names)}")
          PYTHON
      - name: Save successfully prepared display input
        if: >-
          !cancelled() && steps.requirements.outputs.display_workload != '' &&
          steps.display-cache.outputs.cache-hit != 'true' && hashFiles('ci-fixtures/**/ci-ready.json') != ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ci-fixtures
          key: ${{ steps.display-cache.outputs.cache-primary-key }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-${{ inputs.os }}-${{ inputs.tier }}-${{ matrix.shard }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Exact test coverage
    needs: [build, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      TEST_RESULT: ${{ needs.test.result }}
      TIER: ${{ inputs.tier }}
    steps:
      - name: Require all processes to finish successfully
        run: |
          test "$BUILD_RESULT" = success
          test "$TEST_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: download-metadata
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: metadata-${{ inputs.os }}-${{ inputs.tier }}
          path: ci-artifacts
      - if: ${{ !cancelled() && steps.download-metadata.outcome == 'failure' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 3
        with:
          name: metadata-${{ inputs.os }}-${{ inputs.tier }}
          path: ci-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: download-results
        timeout-minutes: 3
        continue-on-error: true
        with:
          pattern: results-${{ inputs.os }}-${{ inputs.tier }}-*
          path: ci-results
          merge-multiple: true
      - if: ${{ !cancelled() && steps.download-results.outcome == 'failure' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 3
        with:
          pattern: results-${{ inputs.os }}-${{ inputs.tier }}-*
          path: ci-results
          merge-multiple: true
      - name: Prove compiled test coverage and tier accounting
        shell: bash
        run: |
          if [ "$TIER" = fast ]; then
            python scripts/ci_shards.py verify --plan ci-artifacts/ci-plan.json --doc-log ci-artifacts/docs.log --doc-list ci-artifacts/doc-list.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python scripts/ci_shards.py verify --plan ci-artifacts/ci-plan.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi
