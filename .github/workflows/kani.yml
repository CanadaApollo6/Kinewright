name: Kani

# Kani proofs were 17 minutes on every push although their sources rarely
# change. They now run only when a file that holds a harness, or code a
# harness proves, changed:
#   crates/kinewright-core/src/automation.rs  mo1_proofs (H1-H4): value_at_keys,
#                                             ease_kernel, rounded_div_kernel,
#                                             PROVEN_VALUE_BOUND, Keyframe types
#   crates/kinewright-core/src/incident.rs    kani_proofs: restore_id_resume,
#                                             MAX_RESTORED_ID, compact_json_len
#   crates/kinewright-core/src/time.rs        TimeCode, the frame type the MO1
#                                             harnesses build keyframes from
#   crates/kinewright-core/Cargo.toml, Cargo.toml, Cargo.lock
#                                             the dependencies and the
#                                             `cfg(kani)` lint the proofs compile with
# `workflow_dispatch` runs them on demand (Actions tab, or `gh workflow run
# kani.yml`). A new `#[kani::proof]` in any other file must add that file here.
on:
  push:
    branches: [main]
    paths:
      - crates/kinewright-core/src/automation.rs
      - crates/kinewright-core/src/incident.rs
      - crates/kinewright-core/src/time.rs
      - crates/kinewright-core/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/kani.yml
  pull_request:
    paths:
      - crates/kinewright-core/src/automation.rs
      - crates/kinewright-core/src/incident.rs
      - crates/kinewright-core/src/time.rs
      - crates/kinewright-core/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/kani.yml
  workflow_dispatch:

jobs:
  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Default key includes rustc (host/release/hash) and a hash of every
      # Cargo.lock / Cargo.toml, so a lockfile or toolchain bump misses.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # `cargo kani setup` downloads the pinned toolchain + CBMC bundle and
      # no-ops when it is already present, so this cache skips the big
      # download on warm runners. Both paths: `~/.kani/kani-<version>/
      # toolchain` is a symlink into the rustup toolchain dir, so caching
      # only `~/.kani` would restore a dangling link. The toolchain dir
      # name comes with the Kani version — bump both together.
      - name: Cache Kani
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.rustup/toolchains/nightly-2026-08-21-x86_64-unknown-linux-gnu
          key: kani-0.68.0

      # No native-deps step: kinewright-core is pure Rust (ab_glyph,
      # crossbeam-channel, schemars, serde, thiserror), and the Kani bundle
      # ships prebuilt binaries (compiler, CBMC, solvers).
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup

      # Only the named, admitted harnesses (each < 5 min / < 6 GB per the
      # admission rule in incident.rs): never bare `cargo kani`, which would
      # also pick up future proofs that do not meet the rule.
      # MO1 R32: H1–H4 at N=2/3/4 (twelve); ~9 min wall, tightest margin 2.1x
      # (H1-N4 143 s). H6 translation-equivariance missed the rule (N=2
      # timeout 900 s, erratum MR1) and rides proptest + segment-local
      # reasoning instead — it has no harness here by design (R33).
      - name: Verify admitted proofs
        run: |
          set -euo pipefail
          cargo kani -p kinewright-core --harness kani_restore_id_resume || exit 1
          cargo kani -p kinewright-core --harness kani_compact_json_len_anchor || exit 1
          cargo kani -p kinewright-core --harness kani_compact_json_len_symbolic || exit 1
          cargo kani -p kinewright-core --harness mo1_h1_n2 || exit 1
          cargo kani -p kinewright-core --harness mo1_h1_n3 || exit 1
          cargo kani -p kinewright-core --harness mo1_h1_n4 || exit 1
          cargo kani -p kinewright-core --harness mo1_h2_n2 || exit 1
          cargo kani -p kinewright-core --harness mo1_h2_n3 || exit 1
          cargo kani -p kinewright-core --harness mo1_h2_n4 || exit 1
          cargo kani -p kinewright-core --harness mo1_h3_n2 || exit 1
          cargo kani -p kinewright-core --harness mo1_h3_n3 || exit 1
          cargo kani -p kinewright-core --harness mo1_h3_n4 || exit 1
          cargo kani -p kinewright-core --harness mo1_h4_n2 || exit 1
          cargo kani -p kinewright-core --harness mo1_h4_n3 || exit 1
          cargo kani -p kinewright-core --harness mo1_h4_n4 || exit 1
