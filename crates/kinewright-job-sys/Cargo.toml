[package]
name = "kinewright-job-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
slow-tests = []

[target.'cfg(target_os = "linux")'.dependencies]
kinewright-hash = { path = "../kinewright-hash" }
landlock.workspace = true
seccompiler.workspace = true
libc.workspace = true
rustix = { version = "=1.1.4", features = ["fs", "process", "event", "pipe", "thread", "mount", "net", "stdio", "linux_latest"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
assert_is_empty = "allow"

# Cargo exposes this helper to the LPAC integration suite through CARGO_BIN_EXE.
[[bin]]
name = "kinewright-lpac-spike-child"
path = "tests/fixtures/lpac_child.rs"
test = false
bench = false
doc = false
