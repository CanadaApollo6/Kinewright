[package]
name = "kinewright-app"
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Slow tier (docs/BUILDING.md, ci/slow-tests.txt): tests marked with
# `cfg_attr(not(feature = "slow-tests"), ignore = ...)` run only with this
# feature, which CI's slow tier and a full local run enable.
slow-tests = []

[dependencies]
crossbeam-channel.workspace = true
eframe.workspace = true
egui_extras.workspace = true
image.workspace = true
kinewright-agent = { path = "../kinewright-agent", default-features = false }
kinewright-core = { path = "../kinewright-core" }
kinewright-media = { path = "../kinewright-media" }
kinewright-project = { path = "../kinewright-project" }
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
pollster.workspace = true
proptest.workspace = true
# The person-path tests read `au6_scenarios` / `cc7_scenarios` and generate
# media through `test_support`; none of that is in a shipping path.
kinewright-core = { path = "../kinewright-core", features = ["test-util"] }
kinewright-media = { path = "../kinewright-media", features = ["test-util"] }
kinewright-project = { path = "../kinewright-project", features = ["test-util"] }

[lints]
workspace = true

