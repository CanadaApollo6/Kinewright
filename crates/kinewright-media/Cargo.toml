[package]
name = "kinewright-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Enabling media's generators requires core's scenario data: `cc7_sources` and
# `au6_sources` author every buffer from a `cc7_scenarios` / `au6_scenarios`
# constant.
test-util = ["kinewright-core/test-util"]

[dependencies]
ab_glyph.workspace = true
cpal.workspace = true
crossbeam-channel.workspace = true
ffmpeg-next.workspace = true
half.workspace = true
kinewright-core = { path = "../kinewright-core" }
pollster.workspace = true
reqwest.workspace = true
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu.workspace = true
whisper-rs.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The `cfg(test)` fixture modules (`cc7_fixtures`, `au6_fixtures`, ...) read
# both, so testing this crate turns both gates on without a release build
# seeing either.
kinewright-core = { path = "../kinewright-core", features = ["test-util"] }
kinewright-media = { path = ".", features = ["test-util"] }

[lints]
workspace = true
