[package]
name = "kinewright-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# R26: the `kinewright-eval` binary imports `kinewright_media::cc7_sources`,
# `test_support` and `kinewright_core::cc7_scenarios` at module scope, so the
# harness genuinely needs the fixture gates at build time. It stays a default
# feature, which keeps `cargo build --workspace`, `cargo test --workspace` and
# `cargo clippy --all-targets` building, running and linting the binary with no
# extra flag. Required-feature declarations also protect explicit production builds
# with defaults disabled; the default and explicit eval gates still build both bins.
# `kinewright-app` takes this crate with `default-features = false` instead, so
# the shipping binary links an agent library with no fixture data in it.
default = ["eval-harness"]
# MO2 R7: the harness saves its project fixtures through the shared project
# writer, so they stamp the same minimum-required format version.
eval-harness = [
    "test-util",
    "kinewright-core/test-util",
    "kinewright-media/test-util",
    "kinewright-project/test-util",
]
test-util = []
# Slow tier (docs/BUILDING.md, ci/slow-tests.txt): tests marked with
# `cfg_attr(not(feature = "slow-tests"), ignore = ...)` run only with this
# feature, which CI's slow tier and a full local run enable.
slow-tests = []

[[bin]]
name = "kinewright"
path = "src/bin/kinewright.rs"

# S4 C2
[[bin]]
name = "kinewright-job-guardian"
path = "src/bin/kinewright-job-guardian.rs"

[[bin]]
name = "kinewright-eval"
path = "src/bin/kinewright-eval.rs"
required-features = ["eval-harness"]

[[bin]]
name = "kinewright-ja-baseline"
path = "src/bin/kinewright-ja-baseline.rs"
required-features = ["eval-harness"]

[dependencies]
# S4 C2
kinewright-job-sys.workspace = true
axum.workspace = true
base64.workspace = true
crossbeam-channel.workspace = true
getrandom.workspace = true
image.workspace = true
kinewright-core = { path = "../kinewright-core" }
kinewright-media = { path = "../kinewright-media" }
kinewright-project = { path = "../kinewright-project" }
reqwest.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
# Already pinned transitively; safe waitid(WNOWAIT), group signals and fixed-role reaping.
rustix = { version = "=1.1.4", features = ["process", "fs"] }

[dev-dependencies]
# `tests/mcp_server.rs` drives the AU6 scenarios and generates their sources,
# so the gates are on when testing this crate even with default features off.
kinewright-core = { path = "../kinewright-core", features = ["test-util"] }
kinewright-media = { path = "../kinewright-media", features = ["test-util"] }
kinewright-project = { path = "../kinewright-project", features = ["test-util"] }

[lints]
workspace = true

