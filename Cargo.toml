[workspace]
members = [
    "crates/openreel-core",
    "crates/openreel-media",
    "crates/openreel-agent",
    "crates/openreel-app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
repository = "https://github.com/rielstamand/OpenReel"

# Every third-party version is pinned here. Member manifests only opt in with
# `workspace = true`, keeping the dependency graph versioned in one place.
[workspace.dependencies]
crossbeam-channel = "=0.5.16"
eframe = "=0.35.0"
ffmpeg-next = { version = "=8.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
proptest = "=1.11.0"
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
