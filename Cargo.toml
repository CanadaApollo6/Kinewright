[workspace]
members = [
    "crates/openreel-core",
    "crates/openreel-media",
    "crates/openreel-agent",
    "crates/openreel-app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
repository = "https://github.com/CanadaApollo6/OpenReel"

# Every third-party version is pinned here. Member manifests only opt in with
# `workspace = true`, keeping the dependency graph versioned in one place.
[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "=0.23.1"
cpal = "=0.18.1"
crossbeam-channel = "=0.5.16"
eframe = "=0.35.0"
egui_extras = { version = "=0.35.0", default-features = false, features = ["svg"] }
ffmpeg-next = { version = "=8.0.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
image = { version = "=0.25.9", default-features = false, features = ["png"] }
proptest = "=1.11.0"
pollster = "=0.4.0"
rfd = "=0.17.2"
rmcp = { version = "=3.1.2", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
rtrb = "=0.3.4"
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
wgpu = "=29.0.4"
whisper-rs = "=0.16.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
